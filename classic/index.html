<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ra</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<nav id="menubar">
  <div class="menu"><button class="menu-title">Game</button>
    <div class="menu-items">
      <button data-cmd="new3"><span>New Three Player Game</span><kbd>F3</kbd></button>
      <button data-cmd="new4"><span>New Four Player Game</span><kbd>F4</kbd></button>
      <button data-cmd="new5"><span>New Five Player Game</span><kbd>F5</kbd></button>
      <hr>
      <button data-cmd="exit"><span>Exit</span></button>
    </div>
  </div>
  <div class="menu"><button class="menu-title">Options</button>
    <div class="menu-items">
      <button data-cmd="name"><span>Set Player Name</span></button>
      <hr>
      <button data-opt="easy"><span>Easy Mode</span></button>
      <button data-ai="classic"><span>Classic AI (2008)</span></button>
      <button data-ai="improved"><span>Improved AI (2026)</span></button>
      <hr>
      <button data-opt="showScores"><span>Display Scores</span></button>
      <button data-opt="showFDSuns"><span>Display Face-Down Suns</span></button>
      <button data-opt="showShadow"><span>Show Background Tiles</span></button>
      <hr>
      <button data-opt="skipContinue"><span>Skip Continues</span></button>
      <button data-opt="skipConfirm"><span>Skip Confirmation</span></button>
    </div>
  </div>
  <div class="menu"><button class="menu-title">Help</button>
    <div class="menu-items">
      <button data-cmd="rules"><span>How to play Ra</span><kbd>F1</kbd></button>
      <button data-cmd="composition"><span>Initial Bag Composition</span></button>
      <hr>
      <button data-cmd="hint" id="mnuHint"><span>Hint</span><kbd>F9</kbd></button>
      <hr>
      <button data-cmd="about"><span>About Ra</span></button>
    </div>
  </div>
</nav>
<div id="stage"><div id="form"></div></div>
<div id="modalBack" hidden><div id="modal" role="dialog" aria-modal="true"></div></div>
<script src="weights.js?v=9"></script>
<script src="ra_engine.js?v=9"></script>
<script src="ai_improved.js?v=9"></script>
<script src="game.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
