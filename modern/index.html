<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3557">
<title>Ra</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">☀</span><h1>Ra</h1></div>
  <div class="track" id="track" aria-label="Ra track"></div>
  <div class="hdr-info"><span id="epochChip" class="chip"></span><span id="bagChip" class="chip" title="Tiles left in the bag"></span></div>
  <nav class="hdr-actions">
    <button id="btnNew" class="ghost">New game</button>
    <button id="btnScores" class="ghost" title="Scoring breakdown for the whole game so far">Scores</button>
    <button id="btnHistory" class="ghost" title="Game history">History</button>
    <button id="btnRules" class="ghost" title="How to play">Rules</button>
    <button id="btnSettings" class="ghost icon" title="Settings" aria-label="Settings">⚙</button>
    <button id="btnMore" class="ghost icon" title="History, rules and settings" aria-label="More">⋯</button>
  </nav>
</header>

<section id="banner" aria-live="polite">
  <div class="banner-text"><div id="prompt">Start a new game to play against the AIs.</div><div id="subprompt"></div></div>
  <div id="actions" class="actions"></div>
</section>
<div id="hintBox" hidden></div>

<main id="table">
  <section id="blockPanel" class="panel">
    <div class="panel-head"><h2>Auction</h2><span id="lotInfo" class="muted"></span></div>
    <div class="block-row">
      <div class="sun-on-block" title="Sun the auction winner takes (usable next epoch)"><div class="sun big" id="sobSun">1</div><span>prize sun</span></div>
      <div id="slots" class="slots"></div>
    </div>
  </section>

  <section id="players"></section>

  <section id="feedPanel" class="panel">
    <div class="panel-head"><h2>Recent</h2></div>
    <ol id="feed"></ol>
  </section>
</main>

<div id="dock"></div>

<div id="dialogBack" hidden><div id="dialog" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<div id="tip" role="tooltip" hidden></div>

<script src="weights.js?v=7"></script>
<script src="ra_engine.js?v=7"></script>
<script src="ai_improved.js?v=7"></script>
<script src="game.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
